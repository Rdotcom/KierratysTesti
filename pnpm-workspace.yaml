packages:
  - mobile/*
  - backend/*
  - shared/*

# Owner explicitly disabled the release-age waiting period on 2026-11-17.
# Keep frozen lockfile, integrity, build-script and vulnerability checks enabled.
minimumReleaseAge: 0
minimumReleaseAgeStrict: false

# Historical CLI-only Zod security guard; CLI58.1.19 no longer declares Zod,
# so this selector is currently inert and retained with the frozen lock values.
# Tests exercise actual JSON schemas and explicit injection of declared app Zod4.
overrides:
  '@expo/cli>zod': 4.6.7

allowBuilds:
  esbuild: true

onlyBuiltDependencies:
  - '@biomejs/biome'
  - esbuild

patchedDependencies:
  picomatch@2.3.2: patches/picomatch@2.3.2.patch
  picomatch@4.0.5: patches/picomatch@4.0.5.patch
  picomatch@4.0.7: patches/picomatch@4.0.7.patch
