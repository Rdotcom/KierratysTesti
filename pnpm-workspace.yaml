packages:
  - mobile/*
  - backend/*
  - shared/*
  - scripts/glob-adapter

# Owner explicitly disabled the release-age waiting period on 2026-11-17.
# Keep frozen lockfile, integrity, build-script and vulnerability checks enabled.
minimumReleaseAge: 0
minimumReleaseAgeStrict: false

# Historical CLI-only Zod security guard; CLI58.1.19 no longer declares Zod,
# so this selector is currently inert and retained with the frozen lock values.
# Tests exercise actual JSON schemas and explicit injection of declared app Zod4.
overrides:
  '@expo/cli>zod': 4.6.7

allowBuilds:
  esbuild: true

onlyBuiltDependencies:
  - '@biomejs/biome'
  - esbuild

patchedDependencies:
  '@expo/cli@58.1.21': patches/@expo__cli@58.1.21.patch
  '@expo/metro-config@58.0.23': patches/@expo__metro-config@58.0.23.patch
  fdir@6.5.0: patches/fdir@6.5.0.patch
  jest-util@29.7.0: patches/jest-util@29.7.0.patch
  metro-file-map@0.87.1: patches/metro-file-map@0.87.1.patch
  tinyglobby@0.2.17: patches/tinyglobby@0.2.17.patch
  vite@8.3.5: patches/vite@8.3.5.patch
  vitest@4.1.12: patches/vitest@4.1.12.patch
